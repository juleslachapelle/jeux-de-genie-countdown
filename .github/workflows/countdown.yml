
name: Jeux de Genie Countdown

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

jobs:
  update-countdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Slack name
        env:
          SLACK_USER_TOKEN_1: ${{ secrets.SLACK_USER_TOKEN_1 }}
          SLACK_USER_TOKEN_2: ${{ secrets.SLACK_USER_TOKEN_2 }}
        run: python countdown.py
